<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дневник смен водителя</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222e;
      --panel-2: #212b38;
      --line: #2c3847;
      --text: #e6edf3;
      --muted: #8b98a8;
      --accent: #4ea1ff;
      --cash: #4ec9a8;
      --card: #4ea1ff;
      --danger: #ff6b6b;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 22px; margin: 0 0 20px; font-weight: 650; }
    .daybar {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 20px;
    }
    .daybar button {
      background: var(--panel); color: var(--text); border: 1px solid var(--line);
      width: 40px; height: 40px; border-radius: 10px; font-size: 18px; cursor: pointer;
    }
    .daybar button:hover { background: var(--panel-2); }
    .daybar input[type=date] {
      background: var(--panel); color: var(--text); border: 1px solid var(--line);
      padding: 9px 12px; border-radius: 10px; font-size: 15px; color-scheme: dark;
    }
    .panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px;
    }
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .metric .label { color: var(--muted); font-size: 13px; }
    .metric .value { font-size: 22px; font-weight: 650; margin-top: 2px; }
    .metric .value.net { color: var(--cash); }
    .split { display: flex; gap: 10px; margin-top: 16px; }
    .split .seg {
      flex: 1; background: var(--panel-2); border-radius: 10px; padding: 10px 12px;
    }
    .split .seg .t { font-size: 13px; color: var(--muted); }
    .split .seg .v { font-size: 17px; font-weight: 600; margin-top: 2px; }
    .seg.cash .v { color: var(--cash); }
    .seg.card .v { color: var(--card); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
    th { color: var(--muted); font-weight: 500; }
    th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .pill { font-size: 12px; padding: 2px 9px; border-radius: 99px; }
    .pill.cash { background: rgba(78,201,168,.15); color: var(--cash); }
    .pill.card { background: rgba(78,161,255,.15); color: var(--card); }
    .empty { color: var(--muted); text-align: center; padding: 24px; }
    h2 { font-size: 15px; color: var(--muted); font-weight: 500; margin: 0 0 12px; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
    input, select {
      width: 100%; background: var(--panel-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px;
      font-size: 14px; color-scheme: dark;
    }
    .full { grid-column: 1 / -1; }
    button.primary {
      background: var(--accent); color: #06121f; border: 0; border-radius: 9px;
      padding: 11px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button.primary:hover { filter: brightness(1.08); }
    button.primary:disabled { opacity: .6; cursor: progress; }
    .load-error {
      background: rgba(255,107,107,.12); color: var(--danger); border-radius: 10px;
      padding: 10px 14px; margin-bottom: 20px; font-size: 14px;
    }
    .msg { grid-column: 1 / -1; font-size: 14px; min-height: 20px; }
    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--cash); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🚕 Дневник смен водителя</h1>

    <div class="daybar">
      <button id="prev" title="Предыдущий день">‹</button>
      <input type="date" id="date">
      <button id="next" title="Следующий день">›</button>
    </div>

    <div class="load-error" id="load-error" hidden></div>

    <div class="panel">
      <div class="summary-grid">
        <div class="metric"><div class="label">Поездок</div><div class="value" id="s-trips">0</div></div>
        <div class="metric"><div class="label">Выручка</div><div class="value" id="s-revenue">0</div></div>
        <div class="metric"><div class="label">На руки</div><div class="value net" id="s-net">0</div></div>
      </div>
      <div class="split">
        <div class="seg cash"><div class="t">Наличные</div><div class="v" id="s-cash">0</div></div>
        <div class="seg card"><div class="t">Карта</div><div class="v" id="s-card">0</div></div>
        <div class="seg"><div class="t">Комиссия</div><div class="v" id="s-commission">0</div></div>
      </div>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr><th>Начало</th><th>Конец</th><th>Оплата</th><th class="num">Сумма</th><th class="num">Комиссия</th></tr>
        </thead>
        <tbody id="trips"></tbody>
      </table>
      <div class="empty" id="trips-empty" hidden>Нет поездок за этот день</div>
    </div>

    <div class="panel">
      <h2>Добавить поездку</h2>
      <form id="add-form">
        <div><label for="f-start">Начало</label><input type="datetime-local" id="f-start" required></div>
        <div><label for="f-end">Конец</label><input type="datetime-local" id="f-end" required></div>
        <div><label for="f-amount">Сумма (₸)</label><input type="number" id="f-amount" min="1" required></div>
        <div><label for="f-commission">Комиссия (₸)</label><input type="number" id="f-commission" min="0" value="0" required></div>
        <div class="full"><label for="f-payment">Способ оплаты</label>
          <select id="f-payment"><option value="cash">Наличные</option><option value="card">Карта</option></select>
        </div>
        <div class="msg" id="form-msg"></div>
        <button type="submit" class="primary full" id="add-btn">Добавить</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
